<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Glass Gradient -->
    <linearGradient id="bg-grad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182A24"/>
      <stop offset="50%" stop-color="#111B17"/>
      <stop offset="100%" stop-color="#0A0F0D"/>
    </linearGradient>

    <!-- Glass Rim Highlight Gradient -->
    <linearGradient id="rim-grad" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="center-glow" cx="256" cy="256" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#047857" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrow 1 Gradient -->
    <linearGradient id="arrow1-grad" x1="160" y1="130" x2="360" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Arrow 2 Gradient -->
    <linearGradient id="arrow2-grad" x1="360" y1="380" x2="160" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Coin 1 Gradient (Gold / Dollar) -->
    <linearGradient id="coin1-grad" x1="150" y1="190" x2="270" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Coin 2 Gradient (Emerald / Glass) -->
    <linearGradient id="coin2-grad" x1="240" y1="190" x2="360" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="squircle-shadow" x="0" y="8" width="512" height="504" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10B981" flood-opacity="0.2"/>
    </filter>

    <filter id="glow-filter" x="80" y="80" width="352" height="352" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#bg-grad)" filter="url(#squircle-shadow)"/>
  <rect x="48.5" y="48.5" width="415" height="415" rx="103.5" stroke="url(#rim-grad)" stroke-width="2"/>

  <!-- Ambient Light Center -->
  <circle cx="256" cy="256" r="160" fill="url(#center-glow)" filter="url(#glow-filter)"/>

  <!-- Circular Exchange Ring Tracks (Subtle Frosted Glass) -->
  <circle cx="256" cy="256" r="140" stroke="#34D399" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.25" fill="none"/>

  <!-- Top Curved Exchange Arrow (Left to Right / Clockwise) -->
  <path d="M 160 210 A 120 120 0 0 1 350 190" stroke="url(#arrow1-grad)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Arrow Head Top Right -->
  <path d="M 334 162 L 366 194 L 324 212" stroke="url(#arrow1-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Bottom Curved Exchange Arrow (Right to Left / Counter-Clockwise) -->
  <path d="M 352 302 A 120 120 0 0 1 162 322" stroke="url(#arrow2-grad)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Arrow Head Bottom Left -->
  <path d="M 178 350 L 146 318 L 188 300" stroke="url(#arrow2-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Central Intersecting Currency Coins / Badges -->
  <!-- Left Coin (Gold / Dollar) -->
  <g filter="url(#squircle-shadow)">
    <circle cx="218" cy="256" r="54" fill="url(#coin1-grad)"/>
    <circle cx="218" cy="256" r="53" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" fill="none"/>
    <circle cx="218" cy="256" r="46" stroke="#B45309" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
    <!-- Dollar Sign Symbol -->
    <path d="M 218 226 L 218 286 M 227 236 C 227 236 211 233 211 245 C 211 257 227 256 227 268 C 227 280 209 278 209 278" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Coin (Glass / Ruble Dual) -->
  <g>
    <circle cx="294" cy="256" r="54" fill="url(#coin2-grad)"/>
    <circle cx="294" cy="256" r="53" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.7" fill="none"/>
    <!-- Specular highlight on glass coin -->
    <ellipse cx="278" cy="232" rx="20" ry="10" transform="rotate(-30 278 232)" fill="#FFFFFF" fill-opacity="0.4"/>
    <!-- Ruble sign ₽ -->
    <path d="M 284 278 L 284 234 M 284 234 C 298 234 308 238 308 248 C 308 258 298 261 284 261 M 276 261 L 302 261 M 276 270 L 298 270" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Little Sparkle Highlights -->
  <path d="M 370 140 Q 370 152 382 152 Q 370 152 370 164 Q 370 152 358 152 Q 370 152 370 140 Z" fill="#6EE7B7" fill-opacity="0.9"/>
  <path d="M 140 370 Q 140 380 150 380 Q 140 380 140 390 Q 140 380 130 380 Q 140 380 140 370 Z" fill="#FDE68A" fill-opacity="0.85"/>
</svg>
