name: CI & Build Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 || true
          sudo apt-get install -y \
            gir1.2-gnomedesktop-4.0 \
            gir1.2-gtk4layershell-1.0 \
            libgtk4-layer-shell0 \
            gir1.2-tracker-3.0 || true

      - name: Syntax and compile check
        run: |
          python3 -m py_compile *.py modes/*.py providers/*.py

      - name: Build Debian Package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Verify Debian Package Structure
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-search-deb
          path: dist/*.deb
          retention-days: 14
