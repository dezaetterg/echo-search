name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies (GTK4 & GObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-venv \
            python3-pip \
            python3-gi \
            python3-gi-cairo \
            python3-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-gtksource-5 \
            gir1.2-gnomedesktop-4.0 \
            xvfb \
            libgtk-4-bin

      - name: Set up Python virtual environment
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python test & lint dependencies
        run: |
          pip install --upgrade pip
          pip install pytest ruff rapidfuzz

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Test Suite
        run: |
          xvfb-run -a pytest
