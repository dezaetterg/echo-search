name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (GTK4 & GObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-4.0 \
            python3-gi \
            python3-gi-cairo

      - name: Install Python test & lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Test Suite
        run: |
          pytest
