name: Release Multi-Distro Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.5)'
        required: false
        default: 'v1.0.5'

permissions:
  contents: write

jobs:
  build-deb-arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd

      - name: Build Debian Package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Build Arch Linux Package
        run: |
          chmod +x build_arch.sh
          ./build_arch.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-arch-packages
          path: |
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.sha256

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RPM build tools
        run: |
          dnf install -y rpm-build findutils coreutils

      - name: Build RPM Package
        run: |
          chmod +x build_rpm.sh
          ./build_rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: |
            dist/*.rpm
            dist/*.sha256

  publish-release:
    needs: [build-deb-arch, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Generate Release Notes
        run: |
          echo "## 🌊 Echo Search Release" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 📦 Готовые пакеты для установки:" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "* **Debian / Ubuntu / Linux Mint / PikaOS:** \`sudo apt install ./echo-search_*_all.deb\`" >> RELEASE_NOTES.md
          echo "* **Arch Linux / Manjaro / EndeavourOS:** \`sudo pacman -U ./echo-search-*-any.pkg.tar.zst\`" >> RELEASE_NOTES.md
          echo "* **Fedora / RHEL / openSUSE:** \`sudo dnf install ./echo-search-*.noarch.rpm\`" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 🔑 Хоткей по умолчанию:" >> RELEASE_NOTES.md
          echo "Нажмите **Super + Space** (Win + Пробел) для вызова лаунчера." >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release_files/*.deb
            release_files/*.pkg.tar.zst
            release_files/*.rpm
            release_files/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
